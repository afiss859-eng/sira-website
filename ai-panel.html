<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SIRA — AI Studio</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e3e3e8;border-radius:20px;padding:20px;margin:14px 0}input,select,textarea,button{font:inherit;padding:11px;border-radius:11px;border:1px solid #d5d5dc;box-sizing:border-box}input,select,textarea{width:100%;margin:6px 0 10px}textarea{min-height:130px}button{cursor:pointer;font-weight:800}.primary{background:#007aff;color:#fff;border-color:#007aff}.muted{color:#6e6e73;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.out{white-space:pre-wrap;background:#f7f7f9;border-radius:12px;padding:12px;min-height:70px}.key{font-family:ui-monospace,monospace;word-break:break-all}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><div class="muted">SIRA CONTROL PLANE</div><h1>AI Studio & Proforma</h1><p class="muted">Aucune clé OpenAI n’est nécessaire ici. SIRA utilise le moteur compatible OpenAI configuré côté Vercel.</p><label>Email administrateur<input id="email" type="email" value="sawadogoafis125@gmail.com"></label><label>Mot de passe administrateur<input id="password" type="password"></label><button id="login" class="primary">Ouvrir le studio</button><div id="status" class="muted"></div></div><section id="app" class="hidden"><div class="card"><h2>Moteur IA</h2><label>Modèle<select id="model"></select></label><div class="row"><button id="save" class="primary">Enregistrer ce modèle</button><button id="reload">Recharger les modèles</button><a href="manager-admin.html"><button type="button">Contrôle APK</button></a></div><div id="modelStatus" class="muted"></div></div><div class="grid"><div class="card"><h2>Chat IA</h2><label>Message<textarea id="chat" placeholder="Ex. Analyse les ventes de ce commerce et propose 3 actions."></textarea></label><button id="send" class="primary">Envoyer</button><div id="chatOut" class="out" style="margin-top:12px"></div></div><div class="card"><h2>Facture proforma</h2><label>Numéro<input id="num" value="SIRA-PROFORMA"></label><label>Vendeur<input id="seller" value="SIRA"></label><label>Client<input id="client" value="Client"></label><label>Articles (JSON)<textarea id="items">[{"name":"Produit SIRA","quantity":1,"unitPrice":1000}]</textarea></label><label>Taxes (FCFA)<input id="tax" type="number" value="0"></label><label>Visuel généré<input id="gen" type="checkbox" style="width:auto"> Générer une image avec le moteur image</label><label>Prompt image<input id="prompt" value="Visuel professionnel sobre pour un commerce africain moderne, sans texte lisible"></label><button id="proforma" class="primary">Générer la proforma</button><div id="proformaOut" class="out" style="margin-top:12px"></div></div></div></section></main><script>let auth='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function req(path,opt={}){const r=await fetch(path,{...opt,headers:{Accept:'application/json',Authorization:auth,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}async function loadModels(){const d=await req('/api/manager/ai');const models=(d.data?.data||d.data)?.map?.(x=>typeof x==='string'?x:x.id).filter(Boolean)||[];const cfg=await req('/api/manager/ai-config');const list=[...new Set([cfg.selectedModel,'dev-x',...models])].filter(Boolean);$('model').innerHTML=list.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');$('model').value=cfg.selectedModel||'dev-x';$('modelStatus').textContent=`Modèle actif : ${cfg.selectedModel||'dev-x'}`}$('login').onclick=async()=>{auth='Basic '+btoa($('email').value.trim()+':'+$('password').value);$('status').textContent='Vérification…';try{await loadModels();$('app').classList.remove('hidden');$('status').textContent='Connecté.'}catch(e){auth='';$('status').textContent=e.message}};$('reload').onclick=()=>loadModels().catch(e=>$('modelStatus').textContent=e.message);$('save').onclick=async()=>{try{const d=await req('/api/manager/ai-config',{method:'POST',body:JSON.stringify({model:$('model').value})});$('modelStatus').textContent='Modèle enregistré : '+d.selectedModel}catch(e){$('modelStatus').textContent=e.message}};$('send').onclick=async()=>{try{const d=await req('/api/manager/ai',{method:'POST',body:JSON.stringify({type:'chat',model:$('model').value,messages:[{role:'system',content:'Tu es SIRA Assistant, spécialiste commerce, gestion et facturation en Afrique francophone.'},{role:'user',content:$('chat').value}]})});$('chatOut').textContent=d.data?.choices?.[0]?.message?.content||'Réponse vide.'}catch(e){$('chatOut').textContent=e.message}};$('proforma').onclick=async()=>{try{const items=JSON.parse($('items').value);const d=await req('/api/manager/proforma',{method:'POST',body:JSON.stringify({number:$('num').value,sellerName:$('seller').value,clientName:$('client').value,items,tax:$('tax').value,generateImage:$('gen').checked,imagePrompt:$('prompt').value})});$('proformaOut').innerHTML=`<b>Total : ${d.total.toLocaleString('fr-FR')} FCFA</b><br><a href="#" id="open">Ouvrir la proforma imprimable</a>${d.imageUrl?`<br><img src="${d.imageUrl}" style="max-width:220px;border-radius:12px;margin-top:10px">`:''}`;$('open').onclick=()=>{const w=window.open();w.document.write(d.html);w.document.close()}}catch(e){$('proformaOut').textContent=e.message}}</script></body></html>
