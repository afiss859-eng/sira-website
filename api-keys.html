<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SIRA — Clés API</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e3e3e8;border-radius:20px;padding:20px;margin:15px 0}input,button,textarea{font:inherit;padding:11px;border-radius:11px;border:1px solid #d5d5dc}input,textarea{width:100%;box-sizing:border-box;margin:6px 0 10px}button{cursor:pointer;font-weight:800}.primary{background:#007aff;color:#fff;border-color:#007aff}.danger{background:#fff1f0;color:#b51c16}.hidden{display:none!important}.key{padding:12px;border-radius:12px;background:#eef7ee;word-break:break-all;font-family:ui-monospace,monospace}.muted{color:#6e6e73;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #eee}</style></head><body><main class="wrap"><div class="card"><div class="muted">SIRA CONTROL PLANE</div><h1>Génération des clés API</h1><p class="muted">Les clés SIRA internes sont générées côté serveur. Le serveur conserve uniquement leur hash.</p><label>Email administrateur<input id="email" type="email" value="sawadogoafis125@gmail.com"></label><label>Mot de passe administrateur<input id="password" type="password"></label><button id="login" class="primary">Ouvrir</button><div id="status" class="muted"></div></div><section id="app" class="hidden"><div class="card"><h2>Nouvelle clé</h2><input id="label" placeholder="Nom de la clé, ex. SIRA Manager Production"><div class="row"><button id="generate" class="primary">Générer la clé</button><button onclick="location.href='manager-admin.html'">Retour au contrôle APK</button></div><div id="newKey" class="key hidden"></div><p id="warning" class="muted"></p></div><div class="card"><h2>Clés actives</h2><div id="list">Chargement…</div></div></section></main><script>let auth='';const $=id=>document.getElementById(id);async function api(action='overview',opt={}){const r=await fetch('/api/manager/control?action='+encodeURIComponent(action),{...opt,headers:{Accept:'application/json',Authorization:auth,'Content-Type':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Erreur serveur');return d}function render(d){$('list').innerHTML=(d.apiKeys||[]).length?(d.apiKeys.map(k=>`<div class="item"><b>${k.label}</b><div class="muted">${k.prefix}… • ${k.scopes.join(', ')} • ${k.status}</div><button class="danger" onclick="revoke('${k.id}')">Révoquer</button></div>`).join('')):'<div class="muted">Aucune clé.</div>'}async function refresh(){render(await api())}$('login').onclick=async()=>{auth='Basic '+btoa($('email').value.trim()+':'+$('password').value);$('status').textContent='Vérification…';try{await refresh();$('app').classList.remove('hidden');$('status').textContent='Connecté.'}catch(e){auth='';$('status').textContent='Accès refusé.'}};$('generate').onclick=async()=>{try{const d=await api('create-api-key',{method:'POST',body:JSON.stringify({label:$('label').value||'SIRA Manager Production',scopes:['manager:read','manager:write']})});$('newKey').textContent=d.apiKey;$('newKey').classList.remove('hidden');$('warning').textContent=d.warning;await refresh()}catch(e){$('warning').textContent=e.message}};async function revoke(id){if(!confirm('Révoquer cette clé ?'))return;await api('revoke-api-key',{method:'POST',body:JSON.stringify({id})});await refresh()}</script></body></html>
