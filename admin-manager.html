<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SIRA Manager — Admin</title><link rel="icon" href="assets/sira-logo.svg"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7f6;color:#122018}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dce7df;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f4f8f5;border-radius:14px;padding:14px}.stat b{display:block;font-size:28px;color:#0b7041}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccd9d2}input{width:100%;box-sizing:border-box}button{cursor:pointer;font-weight:800;background:#fff}.primary{background:#0b7041;color:#fff;border-color:#0b7041}.danger{background:#fff5f5;color:#a21d1d}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e6eee8;font-size:12px}.badge{padding:5px 8px;border-radius:999px;background:#e7f4eb;color:#0b7041;font-weight:800}.badge.red{background:#fdeaea;color:#a21d1d}</style></head><body><div class="wrap"><h1>SIRA Manager</h1><p>Centre de contrôle distant de l’APK.</p><section id="login" class="card"><h2>Connexion administrateur</h2><input id="password" type="password" placeholder="Mot de passe administrateur"><button id="loginBtn" class="primary" style="margin-top:10px">Ouvrir le centre</button><p id="loginStatus"></p></section><main id="app" class="hidden"><div class="grid"><div class="stat">Licences<b id="licCount">—</b></div><div class="stat">Appareils<b id="devCount">—</b></div><div class="stat">Commandes en attente<b id="cmdCount">—</b></div></div><section class="card"><h2>Générer une licence</h2><div class="grid"><input id="merchant" placeholder="Commerçant"><input id="shop" placeholder="Boutique"><input id="maxUsers" type="number" min="1" value="1" placeholder="Appareils max"></div><div class="row" style="margin-top:10px"><button id="createLicense" class="primary">Générer la clé</button><strong id="newKey"></strong></div></section><section class="card"><h2>Licences</h2><div style="overflow:auto"><table><thead><tr><th>Clé</th><th>Commerce</th><th>Statut</th><th>Action</th></tr></thead><tbody id="licenses"></tbody></table></div></section><section class="card"><h2>Appareils connectés</h2><div style="overflow:auto"><table><thead><tr><th>Appareil</th><th>Licence</th><th>Version</th><th>Statut</th><th>Action</th></tr></thead><tbody id="devices"></tbody></table></div></section></main></div><script>(()=>{let auth='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function api(action='overview',method='GET',body){const r=await fetch('/api/manager/control?action='+encodeURIComponent(action),{method,headers:{Accept:'application/json','Content-Type':'application/json',Authorization:'Basic '+auth},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||'Erreur serveur');return d}async function refresh(){const d=await api();$('licCount').textContent=d.counts.licenses;$('devCount').textContent=d.counts.devices;$('cmdCount').textContent=d.counts.pendingCommands;$('licenses').innerHTML=d.licenses.map(x=>'<tr><td>'+esc(x.licenseKey)+'</td><td>'+esc(x.merchantName)+'<br>'+esc(x.shopName)+'</td><td><span class="badge '+(x.status==='REVOKED'?'red':'')+'">'+esc(x.status)+'</span></td><td><button data-status="'+esc(x.status)+'" data-key="'+esc(x.licenseKey)+'">'+(x.status==='ACTIVE'?'Suspendre':'Activer')+'</button> <button class="danger" data-revoke="'+esc(x.licenseKey)+'">Révoquer</button></td></tr>').join('')||'<tr><td colspan="4">Aucune licence</td></tr>';$('devices').innerHTML=d.devices.map(x=>'<tr><td>'+esc(x.deviceId)+'</td><td>'+esc(x.licenseKey)+'</td><td>'+esc(x.appVersion)+'</td><td>'+esc(x.status)+'</td><td><button data-cmd="FORCE_SYNC" data-dev="'+esc(x.deviceId)+'">Synchro</button> <button data-cmd="SHOW_MESSAGE" data-dev="'+esc(x.deviceId)+'">Message</button> <button class="danger" data-cmd="LOCK_APP" data-dev="'+esc(x.deviceId)+'">Bloquer</button></td></tr>').join('')||'<tr><td colspan="5">Aucun appareil</td></tr>';document.querySelectorAll('[data-key]').forEach(b=>b.onclick=async()=>{await api('set-license-status','POST',{licenseKey:b.dataset.key,status:b.dataset.status==='ACTIVE'?'SUSPENDED':'ACTIVE'});refresh()});document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(confirm('Révoquer cette licence ?')){await api('set-license-status','POST',{licenseKey:b.dataset.revoke,status:'REVOKED'});refresh()}});document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=async()=>{let payload={};if(b.dataset.cmd==='SHOW_MESSAGE'){const m=prompt('Message à afficher sur l’APK :');if(m===null)return;payload={message:m}}await api('command','POST',{deviceId:b.dataset.dev,command:b.dataset.cmd,payload});refresh()})}$('loginBtn').onclick=async()=>{const p=$('password').value;if(!p)return;$('loginStatus').textContent='Connexion…';auth=btoa('sawadogoafis125@gmail.com:'+p);try{await refresh();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){auth='';$('loginStatus').textContent='Accès refusé.'}};$('createLicense').onclick=async()=>{try{const d=await api('create-license','POST',{merchantName:$('merchant').value,shopName:$('shop').value,maxUsers:Number($('maxUsers').value||1)});$('newKey').textContent=d.licenseKey;refresh()}catch(e){$('newKey').textContent=e.message}}})();</script></body></html>
