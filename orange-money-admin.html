<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SIRA • Orange Money</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;margin:0;color:#111}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #0000000d}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccc}button{cursor:pointer;background:#111;color:#fff}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.muted{color:#666;font-size:14px}code{background:#f0f0f0;padding:3px 6px;border-radius:6px}</style></head><body><div class="wrap"><h1>SIRA Orange Money</h1><p class="muted">Application indépendante • même centre de contrôle • configuration prédéfinie.</p><div class="card"><h2>Créer une licence</h2><div class="grid"><input id="merchant" placeholder="Commerce"><input id="appName" value="SIRA Orange Money"><input id="devices" type="number" min="1" value="1" placeholder="Appareils"></div><p><button onclick="createLicense()">Créer la licence</button></p><pre id="result"></pre></div><div class="card"><h2>Licences Orange Money</h2><button onclick="loadApps()">Actualiser</button><div id="apps"></div></div></div><script>const u='/api/manager/orange-money';function headers(){return{Authorization:'Basic '+btoa(prompt('Identifiant administrateur:')+':'+prompt('Mot de passe administrateur:')), 'Content-Type':'application/json'}}async function createLicense(){const r=await fetch(u+'?action=create-license',{method:'POST',headers:headers(),body:JSON.stringify({merchantName:merchant.value,appName:appName.value,maxDevices:Number(devices.value)})});result.textContent=JSON.stringify(await r.json(),null,2);loadApps()}async function loadApps(){const r=await fetch(u,{headers:headers()});const j=await r.json();apps.innerHTML=(j.apps||[]).map(x=>`<div class="card"><b>${x.appName}</b><div>${x.merchantName}</div><code>${x.licenseKey}</code><div>État: ${x.status} • appareils: ${x.deviceCount}/${x.maxDevices}</div></div>`).join('')}</script></body></html>
