<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SIRA — État des API</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e3e3e8;border-radius:20px;padding:20px;margin:15px 0}input,button{font:inherit;padding:11px;border-radius:11px;border:1px solid #d5d5dc}input{width:100%;box-sizing:border-box;margin:6px 0 10px}button{cursor:pointer;font-weight:800}.primary{background:#007aff;color:#fff;border-color:#007aff}.muted{color:#6e6e73;font-size:13px}.provider{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.ok{color:#167a32;font-weight:800}.miss{color:#c7221c;font-weight:800}.small{font-size:12px;color:#6e6e73;margin-top:4px}.hidden{display:none}</style></head><body><main class="wrap"><div class="card"><div class="muted">SIRA CONTROL PLANE</div><h1>État des intégrations API</h1><p class="muted">Cette page vérifie uniquement si les variables d’environnement serveur sont présentes. Aucune clé secrète n’est affichée.</p><label>Email administrateur<input id="email" type="email" value="sawadogoafis125@gmail.com"></label><label>Mot de passe administrateur<input id="password" type="password"></label><button id="login" class="primary">Vérifier</button><div id="status" class="muted"></div></div><section id="app" class="card hidden"><div id="list">Chargement…</div></section></main><script>let auth='';const $=id=>document.getElementById(id);async function check(){const r=await fetch('/api/manager/providers',{headers:{Accept:'application/json',Authorization:auth}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Erreur serveur');$('list').innerHTML=(d.providers||[]).map(p=>`<div class="provider"><div><b>${p.label}</b><div class="small">${p.missing?.length?'Variables manquantes : '+p.missing.join(', '):'Toutes les variables attendues sont présentes.'}</div></div><div class="${p.configured?'ok':'miss'}">${p.configured?'CONFIGURÉ':'INCOMPLET'}</div></div>`).join('')+`<p class="small">Contrôle effectué : ${new Date(d.checkedAt).toLocaleString()}</p>`}$('login').onclick=async()=>{auth='Basic '+btoa($('email').value.trim()+':'+$('password').value);$('status').textContent='Vérification…';try{await check();$('app').classList.remove('hidden');$('status').textContent='Configuration lue côté serveur.'}catch(e){auth='';$('status').textContent=e.message}}</script></body></html>
